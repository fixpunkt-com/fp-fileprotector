name: publish to TER

# Runs only when a version tag (e.g. 3.2.0) is pushed to GitHub and
# publishes that version of the extension to the TYPO3 Extension Repository.
on:
  push:
    tags:
      - '*'

jobs:
  publish:
    name: Publish new version to TER
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      # The extension key is public (see composer.json), so we set it directly.
      TYPO3_EXTENSION_KEY: fp_fileprotector
      # The TER access token must be stored as a repository secret.
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history incl. tag objects so we can read the annotated tag message.
          fetch-depth: 0

      - name: Check that the tag is a semantic version
        run: |
          if ! [[ "${GITHUB_REF#refs/tags/}" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "Tag '${GITHUB_REF#refs/tags/}' is not a valid semantic version (expected e.g. 3.2.0)."
            exit 1
          fi

      - name: Determine version from tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Determine upload comment
        run: |
          # Use the annotated tag message as TER upload comment, fall back to a
          # generated text for lightweight tags or empty messages.
          comment="$(git tag -l "${{ env.version }}" --format='%(contents)')"
          if [[ -z "${comment// }" ]]; then
            comment="Released version ${{ env.version }} of ${{ env.TYPO3_EXTENSION_KEY }}"
          fi
          {
            echo 'comment<<EOF'
            echo "$comment"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Install tailor
        run: |
          composer global require typo3/tailor --prefer-dist --no-progress
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

      - name: Publish to TER
        run: tailor ter:publish --comment "${{ env.comment }}" ${{ env.version }}
