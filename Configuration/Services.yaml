      $viewResolver: '@TYPO3\CMS\Extbase\Mvc\View\ViewResolverInterface'
      $viewFactory: '@TYPO3\CMS\Core\View\ViewFactoryInterface'
      $reflectionService: '@TYPO3\CMS\Extbase\Reflection\ReflectionService'
      $hashService: '@TYPO3\CMS\Core\Crypto\HashService'
      $mvcPropertyMappingConfigurationService: '@TYPO3\CMS\Extbase\Mvc\Controller\MvcPropertyMappingConfigurationService'
      $eventDispatcher: '@Psr\EventDispatcher\EventDispatcherInterface'
      $fileHandlingService: '@TYPO3\CMS\Extbase\Service\FileHandlingService'
      $propertyMapper: '@TYPO3\CMS\Extbase\Property\PropertyMapper'
