<h3>
    <f:translate key="tx_fpfileprotector_domain_model_protection.palette.fe" />
</h3>
<div class="checkbox">
    <label for="feLogin">
        <f:form.checkbox id="feLogin" name="access[fe_login]" value="1" checked="{record.fe_login}" />
        <f:translate key="tx_fpfileprotector_domain_model_protection.fe_login" />
    </label>
</div>
<div class="row">
    <div class="col-xs-12 col-md-6">
        <div class="form-group">
            <label for="userGroups">
                <f:translate key="tx_fpfileprotector_domain_model_protection.user_groups" />
            </label>
            <f:form.select id="userGroups" name="access[user_groups]" multiple="1" size="3" sortByOptionLabel="1"
                options="{userGroups}" optionValueField="uid" optionLabelField="title" value="{record.user_groups}"
                class="form-control" />
            <div class="small">
                <div class="text-muted">
                    <f:translate key="protection.form.multiselect_hint" />
                </div>
                <f:format.raw>
                    <div class="text-warning">
                        <f:translate key="protection.form.selection_condition_hint"
                            arguments="{0 : '{f:translate(key : \'tx_fpfileprotector_domain_model_protection.fe_login\')}'}" />
                    </div>
                </f:format.raw>
            </div>
        </div>
    </div>
    <div class="col-xs-12 col-md-6">
        <div class="form-group">
            <label for="users">
                <f:translate key="tx_fpfileprotector_domain_model_protection.users" />
            </label>
            <f:form.select id="users" name="access[users]" multiple="1" size="3" sortByOptionLabel="1"
                options="{users}" optionValueField="uid" optionLabelField="username" value="{record.users}"
                class="form-control" />
            <div class="small">
                <div class="text-muted">
                    <f:translate key="protection.form.multiselect_hint" />
                </div>
                <f:format.raw>
                    <div class="text-warning">
                        <f:translate key="protection.form.selection_condition_hint"
                            arguments="{0 : '{f:translate(key : \'tx_fpfileprotector_domain_model_protection.fe_login\')}'}" />
                    </div>
                </f:format.raw>
            </div>
        </div>
    </div>
</div>
